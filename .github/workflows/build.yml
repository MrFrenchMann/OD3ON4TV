# Construit l'appli à chaque envoi de fichiers sur GitHub, puis publie
# canape.apk dans « Releases » à une adresse qui ne change jamais :
# https://github.com/<ton-pseudo>/<nom-du-depot>/releases/latest/download/canape.apk
name: Construire l'appli Fire TV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Construire l'APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PbuildNumber=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk canape.apk

      - name: Publier dans Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          gh release create "v$VERSION" canape.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Canapé $VERSION" \
            --notes "Lien d'installation (toujours le même) : https://github.com/${{ github.repository }}/releases/latest/download/canape.apk" \
            --latest
