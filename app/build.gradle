plugins {
    id 'com.android.application'
}

// Numéro de version fourni par GitHub à chaque construction (1, 2, 3…),
// pour que chaque nouvelle version s'installe par-dessus l'ancienne.
def buildNumber = (project.findProperty('buildNumber') ?: '1').toString().toInteger()
// Dépôt GitHub où l'appli va chercher ses mises à jour (fourni par GitHub Actions).
def updateRepo = (project.findProperty('updateRepo') ?: 'MrFrenchMann/OD3ON4TV').toString()

android {
    namespace 'fr.canape.tv'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'fr.canape.tv'
        minSdk 22
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
        buildConfigField 'String', 'UPDATE_REPO', "\"${updateRepo}\""
    }

    // Clé de signature fixe : les mises à jour s'installent sans désinstaller
    // (connexion et réglages conservés). Usage perso uniquement.
    signingConfigs {
        canape {
            storeFile file('canape.keystore')
            storePassword 'canape-tv'
            keyAlias 'canape'
            keyPassword 'canape-tv'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.canape
        }
        debug {
            signingConfig signingConfigs.canape
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
